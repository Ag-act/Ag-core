[package]
name = "Ag-act"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
ratatui = { version = "0.30.2", optional = true }
crossterm = {version = "0.29.0", optional = true}
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
clap = { version = "4.6.7", optional = true, features = ["derive"] }
color-eyre = { version = "0.6.5", optional = true }
asking = { version = "0.0.2", optional = true }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros"] }
confy = { version = "2.0.0"}

[features]
cli = ["dep:clap", "dep:asking","dep:color-eyre"]
ratatui = ["dep:ratatui", "dep:crossterm", "cli"]
