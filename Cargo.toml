[package]
name = "Ag-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A library to be used to make unified todo managers"
repository = "https://github.com/Ag-act/Ag-core"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
confy = { version = "2.0.0"}
